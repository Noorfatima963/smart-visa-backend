<!DOCTYPE html>
<html>
<head>
    <title>Your SmartVisa Verification Code</title>
    <style>
        body { font-family: Arial, sans-serif; background: #F5F8FF; margin: 0; padding: 20px; }
        .container { max-width: 480px; margin: 0 auto; background: #ffffff; border-radius: 12px; padding: 40px 32px; }
        .logo { color: #1A237E; font-size: 22px; font-weight: bold; margin-bottom: 24px; }
        h2 { color: #1A237E; font-size: 20px; margin-bottom: 8px; }
        p { color: #555; font-size: 15px; line-height: 1.6; }
        .otp-box { display: inline-block; background: #1A237E; color: #FFD700; font-size: 36px; font-weight: bold; letter-spacing: 12px; padding: 16px 32px; border-radius: 10px; margin: 24px 0; }
        .note { color: #888; font-size: 13px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">SmartVisa</div>
        <h2>Hello {{ user.first_name }}!</h2>
        <p>Use the code below to verify your email address. This code expires in <strong>10 minutes</strong>.</p>
        <div class="otp-box">{{ otp }}</div>
        <p>Enter this 4-digit code in the app to activate your account.</p>
        <p class="note">If you didn't create a SmartVisa account, you can safely ignore this email.</p>
    </div>
</body>
</html>
